name: publish-stable

# Fork-specific — intentionally diverges from upstream publish.yml. Do not overwrite on upstream sync.
#
# Triggers:
#   1. Tag push `v*`                            -> publish the tagged version
#   2. Push to `master`                         -> publish ONLY if the HEAD commit is a release
#                                                  merge (gating patterns below, ref: opencode-acp release.yml)
#   3. workflow_dispatch(version)               -> publish the given version
# In all cases the detected version MUST equal packages/opencode/package.json or the job fails.
on:
  push:
    branches: [master]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.14.47)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-stable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ranxianglei/opencode-stable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          PKG_VERSION="$(jq -r '.version' packages/opencode/package.json)"
          echo "package.json version: $PKG_VERSION"

          VERSION=""
          SOURCE=""
          # Standard merge of a release branch:
          #   "Merge pull request #25 from ranxianglei/2026-09-15_release-1.14.47"
          #   (also matches acp-style "..._release-v1.13.2")
          RE_BRANCH='Merge pull request #[0-9]+ from .*[0-9]{4}-[0-9]{2}-[0-9]{2}_release-v?([0-9]+\.[0-9]+\.[0-9]+)'
          # Squash/rebase merge of a release PR (this repo's conventions):
          #   "chore: bump version to 1.14.47 (#25)"
          #   "chore: release opencode-stable 1.14.47"
          RE_SQUASH='^chore: (bump version to|release opencode-stable) ([0-9]+\.[0-9]+\.[0-9]+)'
          # acp-compatible explicit marker:
          #   "release: v1.14.47 — ..."
          RE_ACP='^release: v?([0-9]+\.[0-9]+\.[0-9]+)'

          case "$EVENT_NAME" in
            workflow_dispatch)
              VERSION="$INPUT_VERSION"
              SOURCE="workflow_dispatch input"
              ;;
            push)
              if [[ "$REF_NAME" == v* ]]; then
                VERSION="${REF_NAME#v}"
                SOURCE="tag"
              else
                TITLE="$(git log -1 --pretty=%B | head -1)"
                echo "Commit title: $TITLE"
                if [[ "$TITLE" =~ $RE_BRANCH ]]; then
                  VERSION="${BASH_REMATCH[1]}"
                  SOURCE="release-branch merge"
                elif [[ "$TITLE" =~ $RE_SQUASH ]]; then
                  VERSION="${BASH_REMATCH[2]}"
                  SOURCE="release commit"
                elif [[ "$TITLE" =~ $RE_ACP ]]; then
                  VERSION="${BASH_REMATCH[1]}"
                  SOURCE="release commit"
                else
                  echo "Not a release commit — skipping publish."
                  echo "skip=true" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
              ;;
          esac

          if [ -z "$VERSION" ]; then
            echo "::error::No version determined for event $EVENT_NAME"
            exit 1
          fi

          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Refusing to publish: detected version $VERSION ($SOURCE) does not match package.json version $PKG_VERSION"
            exit 1
          fi

          echo "Publishing version: $VERSION (source: $SOURCE)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-bun
        if: steps.ver.outputs.skip == 'false'

      - name: Build all platform targets
        if: steps.ver.outputs.skip == 'false'
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}
        run: bun run script/build.ts -- --no-windows

      - name: Create release tag (master-push mode)
        if: steps.ver.outputs.skip == 'false' && github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        permissions:
          contents: write
        env:
          TAG_NAME: "v${{ steps.ver.outputs.version }}"
        run: |
          if git rev-parse "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists — skipping creation"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "release $TAG_NAME (auto-tagged from release merge)"
          git push origin "$TAG_NAME"
          echo "Created and pushed tag $TAG_NAME"

      - name: Configure npm auth
        if: steps.ver.outputs.skip == 'false'
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: steps.ver.outputs.skip == 'false'
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run script/publish.ts

      - name: Report published version on PR
        if: steps.ver.outputs.skip == 'false' && success() && github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        permissions:
          issues: write
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.ver.outputs.version }}';
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const prNumber = prs.data[0]?.number;
            if (!prNumber) {
              core.info('No associated PR found — skipping comment');
              return;
            }
            const body = [
              `✅ **Published \`opencode-stable@${version}\`** to npm \`latest\`.`,
              '',
              '```bash',
              'npm i -g opencode-stable',
              '```',
              '',
              `[npm](https://www.npmjs.com/package/opencode-stable/v/${version})`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
            core.info(`Commented on PR #${prNumber}: published ${version}`);
